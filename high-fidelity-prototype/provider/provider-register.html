<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Provider Sign Up | MealShare</title>
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body>

  <!-- Nav bar -->
  <nav class="navbar">
    <div class="container">
      <a href="../index.html" class="logo">Meal<span>Share</span></a>
    </div>
  </nav>

  <section class="hero page-section tight">
    <div class="container">
      <h1>Create your account</h1>
      <p>Set up your provider account so we can get your catering profile in front of customers.</p>
    </div>
  </section>

  <section class="page-section">
    <div class="container">
      <div class="card form-card">

        <!-- US-5: Registration form (account creation step). No backend,
             so we just save this to localStorage and pretend the account
             was created. The full catering profile (description, cuisine,
             pricing, etc.) is filled in right after on profile.html. -->
        <form id="register-form">

          <div class="form-group">
            <label for="first-name">First name</label>
            <input type="text" id="first-name" required placeholder="Jordan" />
          </div>

          <div class="form-group">
            <label for="last-name">Last name</label>
            <input type="text" id="last-name" required placeholder="Lee" />
          </div>

          <div class="form-group">
            <label for="business-name">Business name</label>
            <input type="text" id="business-name" required placeholder="Lee's Kitchen" />
          </div>

          <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" required placeholder="jordan@email.com" />
          </div>

          <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" required placeholder="••••••••" />
          </div>

          <div class="form-group">
            <label for="confirm-password">Confirm password</label>
            <input type="password" id="confirm-password" required placeholder="••••••••" />
          </div>

          <p id="error-message" style="color:#b00020; display:none;"></p>

          <button type="submit" class="btn btn-primary btn-block">Create account</button>
        </form>

        <p class="form-footer-text">Already have an account? <a href="provider-login.html">Log in</a></p>

      </div>
    </div>
  </section>

  <footer>
    <p>MealShare demo prototype - CSC 340 Milestone 2</p>
  </footer>

  <script src="../js/provider.js"></script>
  <script>
    // Handle the sign-up form. There's no backend, so we just
    // check the passwords match and save the provider to localStorage.
    document.getElementById("register-form").addEventListener("submit", function (e) {
      e.preventDefault();

      const password = document.getElementById("password").value;
      const confirmPassword = document.getElementById("confirm-password").value;
      const errorEl = document.getElementById("error-message");

      if (password !== confirmPassword) {
        errorEl.textContent = "Passwords do not match. Please try again.";
        errorEl.style.display = "block";
        return;
      }

      if (findProviderByEmail(document.getElementById("email").value)) {
        errorEl.textContent = "An account with that email already exists. Try logging in instead.";
        errorEl.style.display = "block";
        return;
      }

      const provider = {
        firstName: document.getElementById("first-name").value,
        lastName: document.getElementById("last-name").value,
        businessName: document.getElementById("business-name").value,
        email: document.getElementById("email").value,
        password: password
      };

      // Simulate account creation - just store it locally
      registerProvider(provider);

      // Straight into building out the catering profile (US-5).
      window.location.href = "provider-profile.html";
    });
  </script>
</body>
</html>
